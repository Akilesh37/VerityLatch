version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: veritylatch-db
    environment:
      POSTGRES_USER: verityuser
      POSTGRES_PASSWORD: veritypassword2026
      POSTGRES_DB: veritylatch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verityuser -d veritylatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  opa:
    image: openpolicyagent/opa:latest
    container_name: veritylatch-opa
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    volumes:
      - ./opa/policies:/policies
    ports:
      - "8181:8181"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: veritylatch-backend
    environment:
      DATABASE_URL: postgresql://verityuser:veritypassword2026@db:5432/veritylatch
      OPA_URL: http://opa:8181/v1/data/veritylatch/authz
      SECRET_KEY: veritylatch-enterprise-secret-key-change-in-prod-sha256
      ENVIRONMENT: production
      DEBUG: "false"
      LLM_PROVIDER: mock
    depends_on:
      db:
        condition: service_healthy
      opa:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: veritylatch-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
